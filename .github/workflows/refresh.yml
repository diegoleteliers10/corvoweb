name: Refresh Site Data

# The site bakes the Corvo version badge, install commands, and release list
# at build time. This workflow keeps the deployed site current: it polls the
# corvo repo for a new release tag and, when one appears, bumps the fallback
# tag in src/data/releases.ts and pushes. The push redeploys the site on
# whatever host is connected to the repo, and the new build pulls the full
# release data live from the GitHub API.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Detect New Corvo Release
        id: detect
        run: |
          LATEST_TAG=$(curl -fsSL --max-time 30 \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: corvoweb-refresh" \
            "https://api.github.com/repos/diegoleteliers10/corvo/releases/latest" \
            | jq -r '.tag_name // empty')

          if [[ -z "$LATEST_TAG" ]]; then
            echo "Could not read latest corvo release; skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT_TAG=$(grep -o 'FALLBACK_TAG = "[^"]*"' src/data/releases.ts | cut -d'"' -f2)
          echo "latest=$LATEST_TAG current=$CURRENT_TAG"

          if [[ "$LATEST_TAG" != "$CURRENT_TAG" ]]; then
            sed -i "s|FALLBACK_TAG = \"[^\"]*\"|FALLBACK_TAG = \"$LATEST_TAG\"|" src/data/releases.ts
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit Refreshed Version
        if: steps.detect.outputs.changed == 'true'
        env:
          TAG: ${{ steps.detect.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/releases.ts
          git commit -m "chore(site): refresh for corvo $TAG"
          git pull --rebase origin main
          git push
